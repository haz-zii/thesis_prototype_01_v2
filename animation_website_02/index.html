<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <title>Grid</title>
    <script>
      window.TONE_SILENCE_LOGGING = true;
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #3ad24c;
        color-scheme: only light;
        overflow: hidden;
      }

      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #display {
        position: fixed;
        inset: 0;
        z-index: 4;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #score {
        position: fixed;
        z-index: 5;
        top: 28px;
        right: 28px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: min(34vw, 300px);
      }

      #transcript {
        box-sizing: border-box;
        width: 100%;
        max-height: 36vh;
        margin: 0;
        padding: 10px 12px 12px;
        overflow: auto;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(12, 10, 18, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.78);
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.45;
        letter-spacing: 0.08em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        scrollbar-width: none;
        user-select: text;
      }

      #transcript:empty {
        display: none;
      }

      #transcript::-webkit-scrollbar {
        display: none;
      }

      #performance {
        position: fixed;
        z-index: 5;
        left: 28px;
        bottom: 28px;
        margin: 0;
        padding: 10px 14px;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(12, 10, 18, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.78);
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.45;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      #mix {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 12px 14px;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(12, 10, 18, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.78);
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.45;
        letter-spacing: 0.08em;
      }

      #mix .row {
        display: grid;
        grid-template-columns: 6.4em 1fr 3.4em;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
      }

      #mix .row:last-child {
        margin-bottom: 0;
      }

      #mix label {
        margin: 0;
      }

      #mix output {
        margin: 0;
        text-align: right;
      }

      #mix input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: #ffffff;
        cursor: pointer;
      }

      #mix-add {
        display: block;
        width: 100%;
        margin: 12px 0 0;
        padding: 8px 12px;
        color: inherit;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.78);
        font: inherit;
        letter-spacing: inherit;
        cursor: pointer;
      }

      #mix-add[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="display"></canvas>
    <div id="score">
    <pre id="transcript"></pre>
    <div id="mix">
      <div class="row">
        <label for="mix-pitch">Pitch</label>
        <input id="mix-pitch" type="range" min="-12" max="12" step="1" value="0" title="How high or low the notes sit" />
        <output id="mix-pitch-value" for="mix-pitch">0</output>
      </div>
      <div class="row">
        <label for="mix-volume">Volume</label>
        <input id="mix-volume" type="range" min="0" max="1" step="0.01" value="0.7" title="Overall loudness" />
        <output id="mix-volume-value" for="mix-volume">70%</output>
      </div>
      <div class="row">
        <label for="mix-harmonics">Harmonics</label>
        <input id="mix-harmonics" type="range" min="0" max="20" step="0.1" value="12.2" title="Softer tone toward the left, brighter and more complex toward the right" />
        <output id="mix-harmonics-value" for="mix-harmonics">12.2</output>
      </div>
      <div class="row">
        <label for="mix-length">Length</label>
        <input id="mix-length" type="range" min="0.5" max="2" step="0.05" value="1" title="How short or sustained each note feels" />
        <output id="mix-length-value" for="mix-length">1.0×</output>
      </div>
      <button id="mix-add" type="button" aria-pressed="false">Add</button>
    </div>
    </div>
    <button id="performance" type="button" aria-pressed="false">Start</button>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
